<!DOCTYPE html>
<html lang="sa">
<head>
  <meta charset="UTF-8">
  <title>Sanskrit Webpage</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- ⭐ FLEX ROW WRAPPER (sidebar + main-content + case-panel) -->
  <div id="layout-row" style="display:flex; flex-direction:row; align-items:flex-start; gap:20px;">

    <!-- ⭐ LEFT SIDEBAR -->
    <div id="sidebar">
      <!-- ⭐ INDEX CONTAINER -->
      <div id="index-container"></div>
    </div>

    <!-- ⭐ MAIN CONTENT -->
    <div id="main-content">

      <h1 style="text-align: center;">श्रीमद् भागवद् गीता</h1>

      <div class="nav-inline">
        <button id="prevBtn" onclick="changePage(-1)">←</button>
        <div id="pageIndicator"></div>
        <button id="nextBtn" onclick="changePage(1)">→</button>
      </div>

      <div id="shloka-section">
        <div id="shloka" class="sanskrit-text stotra-text"></div>
      </div>

      <div class="section-divider"></div>

      <div id="two-column">
        <div class="column">
          <br><div class="section-title">संधि विच्छेद</div>
          <div id="sandhi" class="sanskrit-text"></div>
        </div>

        <div class="column">
          <br>
          <div class="section-title" id="toggle-title">Transliteration</div>

          <div id="toggle-buttons">
            <button onclick="showTranslit()">Transliteration</button>
            <button onclick="showTranslation()">Translation</button>
          </div>

          <div id="translit" class="sanskrit-text"></div>
          <div id="translation" class="sanskrit-text" style="display:none;"></div>
        </div>
      </div>

    </div> <!-- end main-content -->


	<!-- button to check words missing from the dictionary -->
	<button id="check-missing-btn" onclick="runChecker()">Check Missing Words</button> 


    <!-- ⭐ RIGHT CASE PANEL -->
    <div id="case-panel"></div>

  </div> <!-- end layout-row -->

  <!-- ⭐ COLOR LEGEND -->
  <div id="color-legend">
    Colors legend:
    <span class="noun">Nouns</span>,
    <span class="verb">Verbs</span>,
    <span class="pronoun">Pronouns</span>,
    <span class="adjective">Adjectives</span>,
    <span class="indeclinable">Indeclinable</span>,
    <span class="sandhi">Sandhi-words</span>
  </div>

  <!-- ⭐ Scripts -->

  <!-- Global dictionary -->
  <script src="js/dict.js"></script>

  <!-- Chapter 1-2 sandhi dictionary -->
  <script src="js/dict-sandhi_ch1.js"></script>
  <script src="js/dict-sandhi_ch2.js"></script>
  
	<!-- GROUP FILES -->
	<script src="js/ch1_01_10.js"></script>
	<script src="js/ch1_11_20.js"></script>
	<script src="js/ch1_21_30.js"></script>
	<script src="js/ch1_31_40.js"></script>
	<script src="js/ch1_41_47.js"></script>
	<!-- CHAPTER 2 GROUP FILES -->
	<script src="js/ch2_01_10.js"></script>
	<script src="js/ch2_11_20.js"></script>
	<script src="js/ch2_21_30.js"></script>
	<script src="js/ch2_31_40.js"></script>
	<script src="js/ch2_41_50.js"></script>
	<script src="js/ch2_51_60.js"></script>
	<script src="js/ch2_61_70.js"></script>
	<script src="js/ch2_71_72.js"></script>
	
	<!-- CHAPTER OBJECTS -->
	<script src="js/chapter1.js"></script>
	<script src="js/chapter2.js"></script>
	<script src="js/chapter3.js"></script>

	<script src="js/dict_checker.js"></script>

	<!-- RENDERER (MUST BE LAST) -->
	<script src="js/render.js"></script>

<div id="meaningPopup" style="
  position: absolute;
  background: #fff8dc;
  border: 1px solid #c9a86a;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 18px;
  display: none;
  max-width: 200px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 9999;
"></div>


</body>
</html>
